name: Тесты

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mac:
    name: Mac
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Кэш SwiftPM
        uses: actions/cache@v4
        with:
          path: mac/.build
          key: spm-${{ runner.os }}-${{ hashFiles('mac/Package.swift') }}
      - name: Формула, журнал и сверка с эталоном
        working-directory: mac
        run: swift test

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Формула, журнал и сверка с Mac
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest
